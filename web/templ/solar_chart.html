{% include "_head.html" %}
<div class="topline">
    <div class="title">Solar chart</div>
    <div class="home">
        <a href="/"><img src="/static/home.svg" width="55" /></a>
    </div>
</div>

<div class="container">

    <!-- nginx serves /mqtt.js.client/ from /var/www with no Cache-Control, so a
         phone happily keeps an old copy of the dashboard after it is redeployed
         and the change looks like it never landed. Stamp the URL per page view;
         the document is 23 kB and loads once. -->
    <iframe id="mqttFrame" width="1050" height="900" frameborder="0"></iframe>
    <noscript><iframe src="/mqtt.js.client/" width="1050" height="900" frameborder="0"></iframe></noscript>
    <script>
      document.getElementById("mqttFrame").src = "/mqtt.js.client/?v=" + Date.now();
    </script>
</div>
</script>
