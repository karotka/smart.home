  <script>

    // Local broker over the same /mqtt websocket every other page uses.
    // This used to dial a HiveMQ Cloud instance with its username and
    // password written into the page — in a public repo. The cloud bridge
    // was removed from mosquitto.conf on 2026-10-24, so that account is no
    // longer fed and the credential is no longer here.
    const clientId = 'web-temperature-' + Math.random().toString(16).slice(2, 10);
    const useSSL = (location.protocol === "https:");
    const client = new Paho.Client(location.hostname, useSSL ? 443 : 80, "/mqtt", clientId);

    client.connect({
        onSuccess: onConnect,
        onFailure: onFailure,
        mqttVersion: 3,
        useSSL: useSSL,
        reconnect : true,
    });

    function onFailure() {
        console.log("Fail");
    }

    function onConnect() {
        console.log("MQTT broker connect done.");
        client.subscribe("home/+/temperature/get");
    }

    client.onMessageArrived = onMessageArrived;

        gauge.setValueAnimated(solarPower);
            gauge.setValueAnimated1(actual.solarVoltage);
            gauge.setValueAnimated2(actual.solarCurrent);

    }

  </script>
  <div id="gauge" class="gauge-container"></div>
  <div id="gauge1" class="gauge-container"></div>
  <div id="gauge2" class="gauge-container"></div>

    <script>

      var gauge = Gauge(
          document.getElementById("gauge"), {
              min: 0,
              max: 5200,
              title: "MPPT",
              label: function (value) {
                  return value.toFixed(0) + "W";
              },
              label1: function (value) {return value.toFixed(0) + " V"; },
              label2: function (value) {return value.toFixed(1) + " A"; },
              color: function(value) {
                  if(value < 1500) {
                      return "#ff6600";
                  } else {
                      return "#00cc00";
                  }
              }
          }
      );


</script>
