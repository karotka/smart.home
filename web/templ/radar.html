{% include "_head.html" %}
<div class="topline">
    <div class="title">Radar</div>
    <div class="home">
        <a href="/"><img src="/static/home.svg" width="55" /></a>
    </div>
</div>

<style>
.radarWrap {
    position: absolute;
    top: 47px;
    left: 0;
    right: 0;
    bottom: 0;
    background: #1a2338;
}
#radarMap {
    width: 100%;
    height: 100%;
    background: #1a2338;
}
.radarStatus {
    position: absolute;
    left: 8px;
    bottom: 8px;
    z-index: 500;
    background: rgba(24, 30, 48, 0.85);
    color: #e6e6e6;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    line-height: 1.4;
    pointer-events: none;
    max-width: calc(100vw - 20px);
}
.radarStatus b { color: #4dabf7; }
.leaflet-container { background: #1a2338; }
.leaflet-tile { filter: brightness(0.85) saturate(0.85); }
.planeIcon { line-height: 0; pointer-events: auto; position: relative; }
.planeIcon svg { display: block; filter: drop-shadow(0 0 1.5px rgba(0,0,0,.6)); }
.planeIcon.on-ground svg { opacity: 0.55; }
.planeIcon.on-ground svg path { fill: #666; }
/* Callsign hidden by default; radar_client.js adds .showLabels to the
   map container at zoom ≥ LABEL_MIN_ZOOM, revealing the labels only
   when the user is close enough to read them without crowding. */
.planeIcon .cs {
    display: none;
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    font: 700 10px/1 'Lato', Helvetica, sans-serif;
    color: #fff;
    background: rgba(0,0,0,.75);
    padding: 1px 4px;
    border-radius: 3px;
    white-space: nowrap;
    pointer-events: none;
}
.leaflet-container.showLabels .planeIcon .cs { display: block; }

/* ČHMÚ CAP alerts banner. Hidden by default (no class .show); tapping
   the head flips .open which reveals full details underneath.
   Severity class .sev-Extreme > Severe > Moderate > Minor sets the
   accent color, so a glance says how serious it is. */
.radarAlerts {
    position: absolute;
    top: 6px;
    left: 60px;
    right: 220px;
    z-index: 600;
    display: none;
    background: rgba(24, 30, 48, 0.92);
    color: #fff;
    border-radius: 6px;
    font-size: 12.5px;
    line-height: 1.4;
    border-left: 4px solid #888;
    box-shadow: 0 2px 6px rgba(0,0,0,.35);
    max-width: 900px;
}
.radarAlerts.show     { display: block; }
.radarAlerts.sev-Extreme  { border-left-color: #f03e3e; }
.radarAlerts.sev-Severe   { border-left-color: #fd7e14; }
.radarAlerts.sev-Moderate { border-left-color: #fcc419; }
.radarAlerts.sev-Minor    { border-left-color: #4dabf7; }
.radarAlerts .alHead {
    padding: 7px 10px;
    cursor: pointer;
    font-weight: 600;
    user-select: none;
}
.radarAlerts .alDetails {
    display: none;
    padding: 0 10px 10px;
    max-height: 55vh;
    overflow-y: auto;
}
.radarAlerts.open .alDetails { display: block; }
.radarAlerts .al {
    padding: 8px 0;
    border-top: 1px solid rgba(255,255,255,.12);
}
.radarAlerts .alTitle { font-weight: 600; }
.radarAlerts .alSev {
    display: inline-block;
    padding: 1px 5px;
    margin-left: 6px;
    font-size: 10.5px;
    border-radius: 3px;
    background: #444;
    color: #fff;
    text-transform: uppercase;
}
.radarAlerts .al.sev-Extreme  .alSev { background: #f03e3e; }
.radarAlerts .al.sev-Severe   .alSev { background: #fd7e14; color: #000; }
.radarAlerts .al.sev-Moderate .alSev { background: #fcc419; color: #000; }
.radarAlerts .al.sev-Minor    .alSev { background: #4dabf7; color: #000; }
.radarAlerts .alWhen  { opacity: .8; margin-top: 2px; }
.radarAlerts .alDesc  { margin-top: 4px; opacity: .92; }
.radarAlerts .alAreas { margin-top: 4px; font-size: 11.5px; opacity: .8; }
</style>

<div class="radarWrap">
    <div id="radarMap"></div>
    <div class="radarAlerts" id="radarAlerts">
        <div class="alHead">—</div>
        <div class="alDetails"></div>
    </div>
    <div class="radarStatus">
        <div>Radar: <b data-radar-ts>—</b></div>
        <div>Letadla: <b data-adsb-count>—</b> · <span data-adsb-age>—</span></div>
    </div>
</div>
