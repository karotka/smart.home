[Charge]
# Stages from highest voltage down: when batteryVoltage > threshold use the
# given max charge current (A). Below the lowest threshold use default_current.
#
# Taper is deliberately NEUTRALIZED (one stage above any reachable voltage, so
# default_current always wins). In parallel only the MASTER's MNCHGC takes
# effect — the slave ignores its own and the master's value doesn't propagate —
# so a real taper throttled only the master and left the slave at full current:
# that was the "one inverter idle, one running hot" asymmetry. The CV voltage
# (bulk/float) does the top-off instead. To actually limit charge current, set
# Program 02 on BOTH panels, not here.
#
# 80 A/unit = 160 A total, the inverters' max (array is 4x8x450 W = 14.4 kWp,
# so the charge-current cap, not the panels, is the binding limit on a good day).
stages = 60.0:80
default_current = 80
