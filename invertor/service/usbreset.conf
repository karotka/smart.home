# systemd drop-in that resets the CH341 USB-serial adapter before the invertor
# daemon starts, so the stochastic wedge across a restart clears without a reboot.
#
# Deployed on each inverter Pi as:
#   .225 (master, invertor-first): /etc/systemd/system/invertor-first.service.d/usbreset.conf
#   .223 (slave,  invertor-second): /etc/systemd/system/invertor-second.service.d/usbreset.conf
# then `sudo systemctl daemon-reload`.
#
# Prefix +- : run as root (usbreset needs it; the service runs as pi) and ignore
# failure (reset_usb.sh always exits 0 anyway, so it can never block startup).
[Service]
ExecStartPre=+-/home/pi/smart.home/invertor/reset_usb.sh
