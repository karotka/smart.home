    <body>
      <script>

    // Vytvoření instance klienta
    const clientId = 'client_' + Math.random().toString(16).substr(2, 8);
    
    // Detekce: lokální síť vs ngrok/internet
    const isLocal = window.location.hostname === "192.168.0.222" || 
                    window.location.hostname === "localhost" ||
                    window.location.hostname.startsWith("192.168.");
    
    const mqttHost = isLocal ? "192.168.0.222" : window.location.hostname;
    const mqttPort = 443;
    const mqttPath = "/mqtt";  // nginx proxy path
    const useSSL = window.location.protocol === "https:";
    
    console.log("MQTT connecting to: " + mqttHost + ":" + mqttPort + mqttPath + " SSL:" + useSSL);
    
    // Paho client: (host, port, path, clientId)
    const client = new Paho.MQTT.Client(mqttHost, Number(mqttPort), mqttPath, clientId);

    const params = {
	    onSuccess: onConnect,
	    useSSL: useSSL
	}

    var subscribeOptions = {
    };

	client.connect(params);

    client.onConnectionLost = function (responseObject) {
        console.log("Connection Lost: " + responseObject.errorMessage);
        this.connect(params);
    }

    client.onFailure = function () {
        console.log("Fail");
        this.connect(params);
    }

    function onConnect() {
        console.log("Connection");
        console.log("MQTT broker connect done.");
        client.subscribe("home/invertor/#", subscribeOptions);
        client.subscribe("home/forecast/solar", subscribeOptions);
    }

    client.onMessageArrived = onMessageArrived;

    function toDict(keys, values) {
        var result = {};
        keys.forEach((key, i) => result[key] = values[i]);
        return result;
    }

    function map(value, inMin, inMax, outMin, outMax) {
        const ratio = (value - inMin) / (inMax - inMin);
        const outValue = ratio * (outMax - outMin) + outMin;
        return outValue;
    }

    function chart(data, index, div, round) {
        var svg = '<svg viewBox="0 -83 200 83">';
        var d = [];
        for (var i = 0; i < data.length; i++) {
            d.push(data[i][index]);
        }

        var min = Math.min.apply(Math, d);
        var max = Math.max.apply(Math, d);
        var x = 5;

        for (var j = 0; j < d.length; j++) {
            var h = Math.round(map(d[j], min, max, 0, 40));
            svg += '<rect x="' + (x + 15 * j) + '" y="-' + h + '" height="60" width="15" style="fill:#00cc00;stroke:#808080;stroke-width:1" />';
            svg += '<text x="' + (x + h) + '" y="' + (x + 13 + 15 * j) + '" font-size="11px" style="fill:white" transform="rotate(-90)">' + (d[j]/div).toFixed(round) + '</text>';
        }

        svg += '</svg>';
        return svg;
    }

    // Expected production for today + tomorrow, published hourly by
    // forecast_solar.py as one retained message. Yellow is what the array
    // could make, green is what the inverters actually took — the gap
    // between the two is curtailed solar.
    function renderForecast(obj) {
        var h = obj["hours"] || {};
        var t = h["t"] || [], exp = h["exp_kw"] || [], act = h["act_kw"] || [];
        var n = t.length;
        if (!n) return;

        var W = 200, H = 70, base = H - 2, pad = 4, max = 1, i;
        for (i = 0; i < n; i++) {
            if (exp[i] > max) max = exp[i];
            if (act[i] != null && act[i] > max) max = act[i];
        }

        function X(i) { return (n < 2) ? 0 : i / (n - 1) * W; }
        function Y(v) { return base - (v / max) * (base - pad); }

        function path(arr, close) {
            var d = "", first = null, last = 0;
            for (var j = 0; j < n; j++) {
                if (arr[j] == null) continue;
                if (first === null) first = X(j);
                last = X(j);
                d += (d ? "L" : "M") + X(j).toFixed(1) + " " + Y(arr[j]).toFixed(1) + " ";
            }
            if (!d) return "";
            if (close) d += "L" + last.toFixed(1) + " " + base + " L" + first.toFixed(1) + " " + base + " Z";
            return d;
        }

        var dnow = new Date();
        function p2(x) { return (x < 10 ? "0" : "") + x; }
        var nowKey = dnow.getFullYear() + "-" + p2(dnow.getMonth() + 1) + "-" + p2(dnow.getDate()) +
                     "T" + p2(dnow.getHours()) + ":00";
        var midX = null, nowX = null;
        for (i = 1; i < n; i++) { if (midX === null && t[i].slice(11) == "00:00") midX = X(i); }
        for (i = 0; i < n; i++) { if (t[i] == nowKey) nowX = X(i); }

        var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '">';
        svg += '<path d="' + path(exp, true) + '" style="fill:#e8c34a;opacity:0.25" />';
        svg += '<path d="' + path(exp, false) + '" style="fill:none;stroke:#e8c34a;stroke-width:1.5" />';
        var ap = path(act, true);
        if (ap) {
            svg += '<path d="' + ap + '" style="fill:#00cc00;opacity:0.45" />';
            svg += '<path d="' + path(act, false) + '" style="fill:none;stroke:#00cc00;stroke-width:1.5" />';
        }
        if (midX !== null) {
            svg += '<line x1="' + midX.toFixed(1) + '" y1="0" x2="' + midX.toFixed(1) + '" y2="' + base +
                   '" style="stroke:#8294ad;stroke-width:1" />';
        }
        if (nowX !== null) {
            svg += '<line x1="' + nowX.toFixed(1) + '" y1="0" x2="' + nowX.toFixed(1) + '" y2="' + base +
                   '" style="stroke:#ff6600;stroke-width:1;stroke-dasharray:3 3" />';
        }
        svg += '</svg>';
        document.getElementById("fcastChart").innerHTML = svg;

        var days = obj["days"] || [], out = "", future = 0;
        for (i = 0; i < days.length; i++) {
            var d = days[i];
            if (d["past"]) continue;
            if (d["today"]) {
                out += "<p>today " + (d["actual_kwh"] != null ? d["actual_kwh"].toFixed(1) : "--") +
                       " / " + d["est_kwh"].toFixed(1) + "kWh</p>";
            } else if (future < 3) {
                out += "<p>" + d["dow"] + " " + Math.round(d["est_kwh"]) + "kWh</p>";
                future++;
            }
        }
        document.getElementById("fcastDays").innerHTML = out;
    }

    function onMessageArrived(message) {
        //console.log("Received message in topic: " + message.destinationName);

        const dnow = new Date();
        let month = dnow.getMonth();
        const obj = JSON.parse(message.payloadString);

        if (message.destinationName == "home/invertor/monthly/rows/") {

            dt = chart(obj['values'], 0, 1, 0);
            //console.log(obj);
            //console.log(month);
            document.getElementById("chartDataMonthly").innerHTML = dt;
            document.getElementById("thisMonth").innerHTML = obj['values'][obj['values'].length - 1][0].toFixed(1) + "kWh";

            // tedy je to potreba vyresit
            var sum = 0;
            for (var i = obj['values'].length - 1; i >= obj['values'].length - month - 1; i--) {
                sum = sum + obj['values'][i][0];
            }
            document.getElementById("thisYear").innerHTML = (sum / 1000).toFixed(2) + "MWh";

            //console.log(month);
            //console.log("Monthly done.");

        } else

        if (message.destinationName == "home/invertor/daily/rows/") {

            dict = toDict(obj["columns"], obj["values"].slice(-1)[0]);
            dt = chart(obj['values'], 4, 1000, 1);
            document.getElementById("chartData").innerHTML = dt;

            //console.log(dict);
            document.getElementById("todaySolarIn").innerHTML = (dict["solarPowerIn"] / 1000).toFixed(1) + "kWh";
            document.getElementById("todayPowerOut").innerHTML = (dict["outputPowerActive"] / 1000).toFixed(1) + "kWh";

            html = "<p>" + (dict["solarPowerIn"]/1000 - dict["outputPowerActive"]/1000).toFixed(1) + "kWh</p>";
            document.getElementById("todayPowerDiff").innerHTML = html;

            html =
                "<p>Today In</p>" +
                "<p>Today Out</p>" +
                "<p>Today In-Out</p>"+
                "<p>Max solar curr</p>" +
                "<p>Max mains curr</p>";
            document.getElementById("today-battery-name").innerHTML = html;
            html =
                "<p>" + (dict["batteryPowerIn"]/1000).toFixed(1) + "kWh</p>" +
                "<p>" + (dict["batteryPowerOut"]/1000).toFixed(1) + "kWh</p>" +
                "<p>" + (dict["batteryPowerIn"]/1000 - dict["batteryPowerOut"]/1000).toFixed(1) + "kWh</p><div id='status'/>";

            document.getElementById("today-battery-value").innerHTML = html;
            //console.log("Daily done.");

        } else

        if (message.destinationName == "home/invertor/actual/") {

            // One inverter can be offline (slave Pi down / USB drop): the feeder
            // then publishes an empty {} for it. Coerce every field we use to a
            // number (default 0) so a single-inverter outage shows that unit as 0
            // instead of NaN-ing every gauge on the page.
            function num(x){ x = parseFloat(x); return isNaN(x) ? 0 : x; }
            var FIELDS = ["batteryCurrent","batteryDischargeCurrent","batteryVoltage",
                          "solarCurrent","solarVoltage","solarPowerTotal","solarPowerMeasured",
                          "outputPowerActive","outputVoltage",
                          "gridVoltage","gridFreq"];
            function norm(o){ o = o || {}; var r = {}; FIELDS.forEach(function(f){ r[f] = num(o[f]); }); return r; }
            const actual1 = norm(obj["invertor1"]);
            const actual2 = norm(obj["invertor2"]);
            const status = obj["status"] || {};

            // Battery, output bus and grid are ONE thing measured by each
            // inverter, not two things to add up. norm() turns a missing unit
            // into zeros, so anything reading actual1 alone goes blank the
            // moment that unit is gone — which is what happened on 2026-10-22
            // when the pair became a single 10 kW and this page stopped
            // showing a battery voltage at all. Average whichever units
            // actually reported; one, two or none then all render honestly.
            function shared(field){
                var vals = [actual1[field], actual2[field]].filter(function(v){ return v > 0; });
                if (!vals.length) { return 0; }
                return vals.reduce(function(a, b){ return a + b; }, 0) / vals.length;
            }
            var batteryVoltage = shared("batteryVoltage");
            var outputVoltage  = shared("outputVoltage");

            var batteryCurrent = (actual1.batteryCurrent + actual2.batteryCurrent) - (actual1.batteryDischargeCurrent + actual2.batteryDischargeCurrent);

            var ztrata = -(batteryCurrent) * 0.009;
            var batteryPower = batteryVoltage * batteryCurrent;
            // Battery: 4x14S30P + 4x14S20P LiPo, min 47V (0%), max 57.7V (100%)
            var percentZ = Math.max(0, Math.min(100, (batteryVoltage + ztrata - 47) / 10.7 * 100)).toFixed(2);

            var solarPower1 = actual1.solarCurrent * actual1.solarVoltage;
            var solarPower2 = actual2.solarCurrent * actual2.solarVoltage;
            var measuredSolar = solarPower1 + solarPower2;
            // The 10 kW unit runs two MPPTs and QPIGS reports only one, so the
            // products above are roughly half of what the roof is making. Each
            // unit publishes solarPowerTotal — the balance-based reconstruction
            // of its whole array — and the total is the sum of those, falling
            // back to the products for anything that does not send the field.
            var totalSolarPower = (actual1.solarPowerTotal || solarPower1)
                                + (actual2.solarPowerTotal || solarPower2);
            var hiddenSolar = Math.max(0, totalSolarPower - measuredSolar);

            // Update total solar power display. The per-MPPT gauges below keep
            // showing what is actually reported, so name the reconstructed part
            // instead of letting the two silently disagree.
            var totalEl = document.getElementById("totalSolar");
            if (totalEl) {
                totalEl.textContent = totalSolarPower.toFixed(0) + "W"
                    + (hiddenSolar > 1 ? " (" + measuredSolar.toFixed(0)
                                             + " + " + hiddenSolar.toFixed(0) + " dopočet)" : "");
            }

            // Primary gauge (outer arc) - MPPT1
            gauge.setValueAnimated(solarPower1);
            gauge.setValueAnimated1(actual1.solarVoltage);
            gauge.setValueAnimated2(actual1.solarCurrent);
            // Secondary gauge (inner arc) - MPPT2
            if (gauge.setValueAnimatedSec) {
                gauge.setValueAnimatedSec(solarPower2);
                gauge.setValueAnimated1Sec(actual2.solarVoltage);
                gauge.setValueAnimated2Sec(actual2.solarCurrent);
            }

            // Duplicate gauge3 for MPPT2
            gauge3.setValueAnimated(solarPower2);
            gauge3.setValueAnimated1(actual2.solarVoltage);
            gauge3.setValueAnimated2(actual2.solarCurrent);

            var outputPower = actual1.outputPowerActive + actual2.outputPowerActive;
            gauge1.setValueAnimated(outputPower);
            gauge1.setValueAnimated1(outputVoltage);
            gauge1.setValueAnimated2(outputVoltage > 0 ? outputPower / outputVoltage : 0);

            //console.log("PZ:" + percentZ);
            //console.log("actual1.batteryVoltage:" + actual1.batteryVoltage);
            //console.log("batteryCurrent:" + batteryCurrent);
            gauge2.setValueAnimated(percentZ);
            gauge2.setValueAnimated1(batteryVoltage);
            gauge2.setValueAnimated2(batteryCurrent);

            html =
                "<p>" + batteryPower.toFixed(0) + "W (" + status.workingStatus + ")</p>";
            document.getElementById("batteryPower").innerHTML = html;

            html =
                "<p>" + status.solarMaxChargingCurrent + "A</p>" +
                "<p>" + status.mainsMaxChargingCurrent + "A</p>";
            document.getElementById("status").innerHTML = html;

            html =
                "<p>" + [actual1, actual2]
                    .filter(function(a){ return a.gridVoltage > 0; })
                    .map(function(a){ return a.gridVoltage.toFixed(0) + "V/" + a.gridFreq.toFixed(0); })
                    .join(" ") + "Hz</p>";
            document.getElementById("grid").innerHTML = html;
            //console.log("Actual done.");

        } else

        if (message.destinationName == "home/forecast/solar") {

            renderForecast(obj);
            //console.log("Forecast done.");
        }
    }

    </script>

  <div id="gauge" class="gauge-container"></div>
  <div id="gauge3" class="gauge-container"></div>
  <div id="gauge1" class="gauge-container"></div>
  <div id="gauge2" class="gauge-container"></div>

  <div class="gauge-container">
    <div class="box-title">Last 12 [kWh]</div>
    <div id="chartData"/></div>
    <div id="chartDataMonthly"/></div>
  </div>

  <div class="gauge-container">
    <a href="/battery.html" target="_top" style="text-decoration:none;color:inherit">
      <div class="box-title">Battery</div>
      <div id="today-battery-name"></div>
      <div id="today-battery-value"></div>
      <div id="status"></div>
      <p>Power</p>
      <div id="batteryPower"></div>
    </a>
  </div>

  <div class="gauge-container">
    <div class="box-title">Today</div>
    <p>Solar in</p>
    <div id="todaySolarIn"></div>
    <p>Power out</p>
    <div id="todayPowerOut"></div>
    <p>Diff</p>
    <div id="todayPowerDiff"></div>
  </div>

  <div class="gauge-container">
    <div class="box-title">Forecast</div>
    <div id="fcastChart"></div>
    <div id="fcastDays"></div>
  </div>

  <div class="gauge-container solar-summary">
    <div class="box-title">Solar summary</div>
    <p>Total now</p>
    <div id="totalSolar">0W</div>
    <p>Month / Year</p>
    <div style="display:flex; justify-content:center; gap:10px;">
      <span id="thisMonth">--</span>
      <span id="thisYear">--</span>
    </div>
    <p>Grid</p>
    <div id="grid">--</div>
  </div>

    <script>

      var gauge = Gauge(
          document.getElementById("gauge"), {
              min: 0,
              max: 5200,
              pathSize: 8,
              dual: true,
              title: "MPPT",
              label: function (value) {
                  return value.toFixed(0) + "W";
              },
              label1: function (value) {return value.toFixed(0) + "V"; },
              label2: function (value) {return value.toFixed(1) + "A"; },
              labelSecondary: function (value) {
                  return value.toFixed(0) + "W";
              },
              label1Secondary: function (value) {return value.toFixed(0) + "V"; },
              label2Secondary: function (value) {return value.toFixed(1) + "A"; },
              color: function(value) {
                  if(value < 1500) {
                      return "#ff6600";
                  } else {
                      return "#00cc00";
                  }
              }
          }
      );

      var gauge1 = Gauge(
          document.getElementById("gauge1"), {
              min: 0,
              max: 10400,
              pathSize: 8,
              title: "Output",
              label: function (value) {
                  return value.toFixed(0) + "W";
              },
              label1: function (value) {return value.toFixed(0) + " V"; },
              label2: function (value) {return value.toFixed(1) + " A"; },
              color: function(value) {
                  if(value < 1000) {
                      return "#00ff00";
                  } else if(value < 8000) {
                      return "#00cc00";
                  } else {
                      return "#ff0000";
                  }
              }
          }
      );

      var gauge2 = Gauge(
          document.getElementById("gauge2"), {
              min: 0,
              min1: 0,
              min2: -200,
              max: 100,
              max1: 100,
              max2: 200,
              value: 50,
              title: "Battery",
              pathSize: 8,
              label: function (value) {
                  return value.toFixed(1) + " %";
              },
              label1: function (value) {return value.toFixed(1) + " V"; },
              label2: function (value) {return value.toFixed(1) + " A"; },
              color: function(value) {
                  //console.log(value);
                  if(value < 30) {
                      return "#ff0000";
                  } else if(value < 50) {
                      return "#ff6600";
                  } else {
                      return "#00cc00";
                  }
              }
          }
      );

      var gauge3 = Gauge(
          document.getElementById("gauge3"), {
              min: 0,
              max: 5200,
              pathSize: 8,
              title: "MPPT2",
              label: function (value) {
                  return value.toFixed(0) + "W";
              },
              label1: function (value) {return value.toFixed(0) + " V"; },
              label2: function (value) {return value.toFixed(1) + " A"; },
              color: function(value) {
                  if(value < 1500) {
                      return "#ff6600";
                  } else {
                      return "#00cc00";
                  }
              }
          }
      );




</script>
