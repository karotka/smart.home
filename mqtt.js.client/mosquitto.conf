# Place your local configuration in /etc/mosquitto/conf.d/
#
# A full description of the configuration file is at
# /usr/share/doc/mosquitto/examples/mosquitto.conf.example

pid_file /run/mosquitto/mosquitto.pid

listener 1883
protocol mqtt

listener 8884
protocol websockets

allow_anonymous true

# The HiveMQ Cloud bridge was removed on 2026-10-24 — the account is not used
# any more. It carried `topic # both 0` with `try_private false`, so every local
# message went up to the cloud and came straight back down: each publish was
# delivered to every local subscriber twice, 13 ms apart. The credential that
# used to sit here is in this repo's git history and the repo is public — the
# HiveMQ account has to be deleted or its password rotated, removing the lines
# is not enough.
#bridge_protocol_version mqttv311
#bridge_attempt_unsubscribe false

persistence true
persistence_location /var/lib/mosquitto/

log_dest file /var/log/mosquitto/mosquitto.log

include_dir /etc/mosquitto/conf.d

